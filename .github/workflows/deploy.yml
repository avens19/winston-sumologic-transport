name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write # Required for OIDC
  contents: write

# Publish one release at a time, in push order
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      # The major and minor version come from package.json; the patch version
      # is the run number of this workflow, so every push to master gets its
      # own release. To start a new major or minor, edit package.json.
      - name: Set version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.$GITHUB_RUN_NUMBER"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm publish
      - uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.version }}
          generateReleaseNotes: true
          makeLatest: true
